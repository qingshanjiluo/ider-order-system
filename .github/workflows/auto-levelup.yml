name: ⬆️ 一键升级

# 频率从「每 3 小时」降为「每 6 小时」：
#   与「全账号自动升级」功能重叠（同为遍历账号升级），
#   两者叠加会重复拉取 active-accounts（每次全表筛选 + 排序），
#   是 D1 免费日读额度被烧光的主要来源之一。
#
# 注意：不再传 WORKER_URL —— 该 secret 指向端点不全的遗留 Worker，
#       脚本内部已固定使用 Pages API（可用 ORDER_API_URL 覆盖）。
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  levelup:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 运行一键升级
        run: node 工单系统/gh-actions/level_up.js
        env:
          API_BASE: ${{ secrets.API_BASE }}
          CLIENT_VERSION: ${{ secrets.CLIENT_VERSION }}
          SIGN_KEY: ${{ secrets.SIGN_KEY }}
