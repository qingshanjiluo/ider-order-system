# 独立部署 order-worker
#
# 背景：order-worker（工单自动执行 Worker，cron 每 30 分钟）此前没有任何 CI
# 部署路径，代码改动无法生效——它的 account-count 读取 bug 因此长期留在线上，
# 每 30 分钟给同一张工单补号，是超量注册的成因之一。
#
# 注意：遗留单体 Worker（工作区根 wrangler.worker.toml，name=ider-order-system）
# 刻意不在此部署——它与 Pages 项目同名，历史上出现过"Worker 重复部署"事故。
name: Deploy order-worker

on:
  push:
    branches: [main]
    paths:
      - '工单系统/order-worker/**'
      - '.github/workflows/deploy-order-worker.yml'
  workflow_dispatch:

jobs:
  deploy-order-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wrangler
        run: npm install -g wrangler@4.114.0

      - name: Deploy order-worker
        run: wrangler deploy
        working-directory: 工单系统/order-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
