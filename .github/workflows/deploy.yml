# Cloudflare Pages 部署工作流
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wrangler
        run: npm install -g wrangler@4.114.0

      - name: D1 Schema (CREATE TABLE IF NOT EXISTS)
        run: |
          wrangler d1 execute ider-orders --file=schema.sql --remote
        working-directory: 工单系统
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: D1 Migration - New Tables
        run: |
          wrangler d1 execute ider-orders --file=migration_comprehensive_v17.sql --remote
        working-directory: 工单系统
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: D1 Migration - Add Missing Columns (ignore if exists)
        run: |
          wrangler d1 execute ider-orders --command "ALTER TABLE coupons ADD COLUMN coupon_type TEXT DEFAULT 'percent'" --remote 2>/dev/null || true
          wrangler d1 execute ider-orders --command "ALTER TABLE coupons ADD COLUMN fixed_amount REAL DEFAULT 0" --remote 2>/dev/null || true
          wrangler d1 execute ider-orders --command "ALTER TABLE coupons ADD COLUMN description TEXT DEFAULT ''" --remote 2>/dev/null || true
          wrangler d1 execute ider-orders --command "ALTER TABLE orders ADD COLUMN frozen_points REAL DEFAULT 0" --remote 2>/dev/null || true
          wrangler d1 execute ider-orders --command "ALTER TABLE orders ADD COLUMN invite_code_used TEXT DEFAULT ''" --remote 2>/dev/null || true
          wrangler d1 execute ider-orders --command "ALTER TABLE orders ADD COLUMN dispatch_map TEXT DEFAULT ''" --remote 2>/dev/null || true
          wrangler d1 execute ider-orders --command "ALTER TABLE orders ADD COLUMN material_type TEXT DEFAULT ''" --remote 2>/dev/null || true
          wrangler d1 execute ider-orders --command "ALTER TABLE orders ADD COLUMN clear_type TEXT DEFAULT ''" --remote 2>/dev/null || true
          wrangler d1 execute ider-orders --command "ALTER TABLE game_accounts ADD COLUMN character_name TEXT DEFAULT ''" --remote 2>/dev/null || true
          wrangler d1 execute ider-orders --command "ALTER TABLE game_accounts ADD COLUMN spirit_roots TEXT DEFAULT '{}'" --remote 2>/dev/null || true
          wrangler d1 execute ider-orders --command "ALTER TABLE game_accounts ADD COLUMN operator_id INTEGER DEFAULT 0" --remote 2>/dev/null || true
          wrangler d1 execute ider-orders --command "ALTER TABLE game_accounts ADD COLUMN operator_name TEXT DEFAULT ''" --remote 2>/dev/null || true
          wrangler d1 execute ider-orders --command "ALTER TABLE game_accounts ADD COLUMN created_result TEXT DEFAULT ''" --remote 2>/dev/null || true
          wrangler d1 execute ider-orders --command "ALTER TABLE game_accounts ADD COLUMN setup_status TEXT DEFAULT 'pending'" --remote 2>/dev/null || true
          wrangler d1 execute ider-orders --command "ALTER TABLE game_accounts ADD COLUMN technique_id INTEGER DEFAULT 0" --remote 2>/dev/null || true
          wrangler d1 execute ider-orders --command "ALTER TABLE game_accounts ADD COLUMN map_id INTEGER DEFAULT 0" --remote 2>/dev/null || true
          wrangler d1 execute ider-orders --command "ALTER TABLE game_accounts ADD COLUMN equipped_skills TEXT DEFAULT '[]'" --remote 2>/dev/null || true
          wrangler d1 execute ider-orders --command "ALTER TABLE game_accounts ADD COLUMN battle_auto_restart INTEGER DEFAULT 0" --remote 2>/dev/null || true
          wrangler d1 execute ider-orders --command "ALTER TABLE skins ADD COLUMN original_price INTEGER DEFAULT 0" --remote 2>/dev/null || true
          wrangler d1 execute ider-orders --command "ALTER TABLE skins ADD COLUMN discount_price INTEGER DEFAULT 0" --remote 2>/dev/null || true
          wrangler d1 execute ider-orders --command "ALTER TABLE skins ADD COLUMN category TEXT DEFAULT 'general'" --remote 2>/dev/null || true
          wrangler d1 execute ider-orders --command "ALTER TABLE skins ADD COLUMN rarity TEXT DEFAULT 'common'" --remote 2>/dev/null || true
        working-directory: 工单系统
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        run: wrangler pages deploy . --project-name=ider-order-system
        working-directory: 工单系统/pages-frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
