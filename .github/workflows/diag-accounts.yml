name: 诊断 game_accounts

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 安装 wrangler
        run: npm install -g wrangler@4.114.0
      - name: 诊断
        run: wrangler d1 execute ider-orders --file=maintenance_diag.sql --remote
        working-directory: 工单系统
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}