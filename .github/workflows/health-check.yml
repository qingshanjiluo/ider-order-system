name: 健康检测 - 自动升级到120级

# 频率从「每天 2 次」降为「每天 1 次」：
#   单轮实测耗时约 48 分钟，期间反复拉取 active-accounts（在 2.5 万行表上
#   筛选 + 排序），是 D1 免费日读额度的主要消耗来源之一。
#   健康检测用于修正异常状态，每天 1 次足够；升级本身由
#   「全账号自动升级」（每 2 小时）承担。
#
# 注意：不再传 WORKER_URL —— 该 secret 指向端点不全的遗留 Worker，
#       脚本内部已固定使用 Pages API（可用 ORDER_API_URL 覆盖）。
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: '触发原因'
        required: false
        default: '手动触发'

jobs:
  health:
    name: 检测账号健康状态并自动升级
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        working-directory: 工单系统
        run: npm install

      - name: 执行健康检测
        working-directory: 工单系统
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_BASE: ${{ secrets.API_BASE }}
          SIGN_KEY: ${{ secrets.SIGN_KEY }}
          CLIENT_VERSION: ${{ secrets.CLIENT_VERSION }}
        run: node gh-actions/health_check.js
