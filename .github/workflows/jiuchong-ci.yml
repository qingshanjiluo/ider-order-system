name: jiuchong-ci
on:
  push:
    paths: ['九重宫阙/**', '.github/workflows/jiuchong-ci.yml']
  pull_request:
    paths: ['九重宫阙/**']
  workflow_dispatch:

jobs:
  test:
    name: 回归测试与数据审计
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: 九重宫阙 } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - run: npm test
      - run: node scripts/audit-data.js

  deploy-smoke:
    name: 容器端到端冒烟（真实 daemon）
    runs-on: ubuntu-latest
    needs: test
    defaults: { run: { working-directory: 九重宫阙 } }
    env:
      JWT_SECRET: Kq7Zx4Vb9Lt2Wn8Rd5Mh1Pf6Ts3Yg0Jc4Bv7Nm2Qz9Lk
    steps:
      - uses: actions/checkout@v4
      - name: compose 结构校验
        run: docker compose config -q
      - name: 构建并起容器
        run: docker compose up -d --build
      - name: 健康探针（最长等 90s）
        run: |
          for i in $(seq 1 30); do
            body=$(curl -fsS http://127.0.0.1:3000/api/health || true)
            if echo "$body" | grep -q '"ok":true'; then
              echo "HEALTH OK: $body"; exit 0
            fi
            sleep 3
          done
          echo "启动失败，容器日志："; docker compose logs --tail 80; exit 1
      - name: 关键端点可达（未鉴权应 401/403，而非 500）
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/characters)
          echo "GET /api/characters -> $code"
          test "$code" != "500" -a "$code" != "000"
      - if: always()
        name: 收尾
        run: docker compose down -v
