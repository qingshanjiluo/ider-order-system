# 真删超额游戏账号（B 方案，用户确认：游戏账号可删，平台用户数据保留）
#
# 循环执行 maintenance_trim_excess_accounts.sql（每轮各 DELETE 至多 1000 个
# 账号 id + 关联日志），以每轮 "changes"（实际写入/删除行数）为收敛信号：
# 低于 50 即视为已清完。只删 game_accounts/account_logs/checkin_logs，
# 不触碰 users/orders。最终核对步骤始终执行。
name: 真删超额游戏账号

on:
  workflow_dispatch:
    inputs:
      reason:
        description: '触发原因'
        required: false
        default: '手动触发'

jobs:
  trim:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: 安装 wrangler
        run: npm install -g wrangler@4.114.0

      - name: 分批真删
        continue-on-error: true
        working-directory: 工单系统
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for i in $(seq 1 15); do
            echo "──── 第 $i 轮 ────"
            OUT=$(wrangler d1 execute ider-orders --file=maintenance_trim_excess_accounts.sql --remote 2>&1) || { echo "$OUT"; exit 1; }
            CH=$(echo "$OUT" | sed -r 's/\x1B\[[0-9;]*[mGKHF]//g' | grep -oE '"changes": *[0-9]+' | tail -1 | grep -oE '[0-9]+')
            RW=$(echo "$OUT" | sed -r 's/\x1B\[[0-9;]*[mGKHF]//g' | grep -oE '"size_after": *[0-9]+' | tail -1 | grep -oE '[0-9]+')
            echo "本轮删除/写入: ${CH:-?} 行；DB 当前大小: $(( ${RW:-0} / 1048576 )) MB"
            if [ -z "$CH" ]; then echo "未取到 changes，停止循环"; break; fi
            if [ "$CH" -lt 50 ]; then echo "✅ 已收敛，停止"; break; fi
          done

      - name: 最终核对（各表计数）
        working-directory: 工单系统
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler d1 execute ider-orders --remote --json --command "SELECT 'FINAL total=' || (SELECT COUNT(*) FROM game_accounts) || ' o193=' || (SELECT COUNT(*) FROM game_accounts WHERE order_id=193) || ' o262=' || (SELECT COUNT(*) FROM game_accounts WHERE order_id=262) || ' o292=' || (SELECT COUNT(*) FROM game_accounts WHERE order_id=292) || ' o293=' || (SELECT COUNT(*) FROM game_accounts WHERE order_id=293) || ' junk=' || (SELECT COUNT(*) FROM game_accounts WHERE health_status='cleaned' OR status='deleted') || ' users=' || (SELECT COUNT(*) FROM users) || ' orders=' || (SELECT COUNT(*) FROM orders) || ' logs=' || (SELECT COUNT(*) FROM account_logs)" 2>&1 \
            | sed -r 's/\x1B\[[0-9;]*[mGKHF]//g'