name: 核对超额清理结果

# 一次性核对：直接把超额工单的现存账号数打到日志里，
# 不依赖 Pages 的读取（读额度受限时也能看到结果）。
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 安装 wrangler
        run: npm install -g wrangler@4.114.0
      - name: 核对
        run: wrangler d1 execute ider-orders --file=maintenance_verify_excess.sql --remote
        working-directory: 工单系统
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
