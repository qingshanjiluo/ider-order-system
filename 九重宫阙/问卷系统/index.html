<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>九重宫阙 - 方案确认系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #16213e 0%, #0f3460 100%); padding: 30px 20px; text-align: center; }
        .header h1 { color: #e94560; font-size: 2.2em; margin-bottom: 8px; }
        .header p { color: #888; font-size: 1em; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .toolbar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 20px 0; }
        .toolbar button { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 0.95em; font-weight: bold; transition: all 0.3s; }
        .btn-export { background: #2ecc71; color: white; }
        .btn-import { background: #3498db; color: white; }
        .btn-clear { background: #e74c3c; color: white; }
        .toolbar button:hover { transform: translateY(-2px); opacity: 0.9; }
        .progress-box { background: #16213e; border-radius: 12px; padding: 20px; margin: 20px 0; text-align: center; }
        .progress-box .text { color: #e94560; font-size: 1.1em; font-weight: bold; margin-bottom: 10px; }
        .progress-box .bar { height: 16px; background: #0f3460; border-radius: 8px; overflow: hidden; }
        .progress-box .fill { height: 100%; background: linear-gradient(90deg, #e94560, #ff6b6b); transition: width 0.5s; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; margin: 20px 0; }
        .card { background: #16213e; border-radius: 12px; padding: 20px; cursor: pointer; transition: all 0.3s; border: 2px solid transparent; text-decoration: none; color: inherit; display: block; }
        .card:hover { transform: translateY(-3px); border-color: #e94560; box-shadow: 0 8px 25px rgba(233,69,96,0.2); }
        .card-header { display: flex; align-items: center; gap: 15px; }
        .card-icon { width: 50px; height: 50px; background: linear-gradient(135deg, #e94560, #ff6b6b); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5em; }
        .card-info { flex: 1; }
        .card-title { color: #e94560; font-size: 1.15em; font-weight: bold; }
        .card-desc { color: #888; font-size: 0.85em; margin-top: 4px; }
        .card-status { margin-top: 12px; padding: 6px 12px; border-radius: 6px; font-size: 0.8em; display: inline-block; }
        .status-done { background: rgba(46,204,113,0.2); color: #2ecc71; }
        .status-pending { background: rgba(241,196,15,0.2); color: #f1c40f; }
        .summary-btn { display: block; width: 100%; max-width: 400px; margin: 30px auto; padding: 18px; background: linear-gradient(135deg, #e94560, #ff6b6b); color: white; border: none; border-radius: 12px; font-size: 1.2em; font-weight: bold; cursor: pointer; transition: all 0.3s; text-decoration: none; text-align: center; }
        .summary-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(233,69,96,0.4); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: #16213e; border-radius: 12px; padding: 25px; max-width: 500px; width: 90%; }
        .modal-content h3 { color: #e94560; margin-bottom: 15px; }
        .modal-content textarea { width: 100%; height: 150px; background: #0f3460; border: 2px solid #e94560; border-radius: 8px; color: white; padding: 12px; font-size: 0.9em; resize: vertical; }
        .modal-btns { display: flex; gap: 10px; margin-top: 15px; justify-content: flex-end; }
        .modal-btns button { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .modal-btns .confirm { background: #e94560; color: white; }
        .modal-btns .cancel { background: #34495e; color: white; }
        .note { background: #2d2d44; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 0.9em; color: #aaa; }
        .note strong { color: #e94560; }
    </style>
</head>
<body>
    <div class="header">
        <h1>九重宫阙</h1>
        <p>游戏方案确认系统 v2.0</p>
    </div>
    
    <div class="container">
        <div class="note">
            <strong>功能说明：</strong>点击卡片进入各系统问卷，选择后自动保存。点击"导出答案"可保存进度到文件，下次点击"导入答案"恢复。
        </div>

        <div class="toolbar">
            <button class="btn-export" onclick="exportAnswers()">导出答案</button>
            <button class="btn-import" onclick="showImportModal()">导入答案</button>
            <button class="btn-clear" onclick="clearAll()">清除所有</button>
        </div>

        <div class="progress-box">
            <div class="text">总进度：<span id="totalProgress">0</span> / 14 系统已完成</div>
            <div class="bar"><div class="fill" id="progressFill"></div></div>
        </div>
        
        <div class="grid" id="cardGrid"></div>
        
        <a href="summary.html" class="summary-btn">查看汇总 & 导出答案</a>
    </div>

    <div class="modal" id="importModal">
        <div class="modal-content">
            <h3>导入答案</h3>
            <textarea id="importText" placeholder="请粘贴之前导出的答案数据..."></textarea>
            <div class="modal-btns">
                <button class="cancel" onclick="hideImportModal()">取消</button>
                <button class="confirm" onclick="importAnswers()">确认导入</button>
            </div>
        </div>
    </div>

    <script>
    const systems = [
        { id: '01', name: '修炼系统', icon: '修', desc: '境界、突破、渡劫', total: 5 },
        { id: '02', name: '战斗系统', icon: '战', desc: '战斗方式、伤害、时间', total: 5 },
        { id: '03', name: '副本系统', icon: '副', desc: '副本类型、评价、BOSS', total: 5 },
        { id: '04', name: '装备系统', icon: '装', desc: '品质、强化、套装', total: 5 },
        { id: '05', name: '功法系统', icon: '功', desc: '装备、技能、升级', total: 4 },
        { id: '06', name: '灵宠系统', icon: '宠', desc: '出战、培养、技能', total: 4 },
        { id: '07', name: '仙盟系统', icon: '盟', desc: '等级、建筑、职位', total: 5 },
        { id: '08', name: '变现系统', icon: '氪', desc: 'VIP、套餐、充值', total: 5 },
        { id: '09', name: '竞技系统', icon: '竞', desc: '竞技场、擂台、联赛', total: 5 },
        { id: '10', name: '赛季系统', icon: '赛', desc: '周期、奖励、排名', total: 4 },
        { id: '11', name: '飞升系统', icon: '飞', desc: '转化、条件、奖励', total: 4 },
        { id: '12', name: '挂机系统', icon: '挂', desc: '模式、离线、体力', total: 5 },
        { id: '13', name: '签到系统', icon: '签', desc: '签到、补签、奖励', total: 3 },
        { id: '14', name: '成就系统', icon: '成', desc: '分类、奖励、难度', total: 4 }
    ];

    function getProgress() {
        let done = 0;
        systems.forEach(s => {
            const answers = JSON.parse(localStorage.getItem(`answers_${s.id}`) || '{}');
            const answered = Object.keys(answers).filter(k => answers[k]).length;
            if (answered >= s.total) done++;
        });
        return done;
    }

    function getAnsweredCount(systemId) {
        const answers = JSON.parse(localStorage.getItem(`answers_${systemId}`) || '{}');
        return Object.keys(answers).filter(k => answers[k]).length;
    }

    function renderCards() {
        const grid = document.getElementById('cardGrid');
        grid.innerHTML = '';
        const totalDone = getProgress();
        
        document.getElementById('totalProgress').textContent = totalDone;
        document.getElementById('progressFill').style.width = `${(totalDone/14)*100}%`;
        
        systems.forEach(s => {
            const answered = getAnsweredCount(s.id);
            const isDone = answered >= s.total;
            
            const card = document.createElement('a');
            card.href = `questionnaire-${s.id}.html`;
            card.className = 'card';
            card.innerHTML = `
                <div class="card-header">
                    <div class="card-icon">${s.icon}</div>
                    <div class="card-info">
                        <div class="card-title">${s.name}</div>
                        <div class="card-desc">${s.desc}</div>
                    </div>
                </div>
                <div class="card-status ${isDone ? 'status-done' : 'status-pending'}">
                    ${isDone ? '已完成' : `${answered}/${s.total} 题`}
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function exportAnswers() {
        const data = {};
        systems.forEach(s => {
            data[s.id] = JSON.parse(localStorage.getItem(`answers_${s.id}`) || '{}');
        });
        const json = JSON.stringify(data, null, 2);
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `九重宫阙_答案备份_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
    }

    function showImportModal() {
        document.getElementById('importModal').classList.add('active');
        document.getElementById('importText').value = '';
    }

    function hideImportModal() {
        document.getElementById('importModal').classList.remove('active');
    }

    function importAnswers() {
        try {
            const text = document.getElementById('importText').value.trim();
            const data = JSON.parse(text);
            systems.forEach(s => {
                if (data[s.id]) {
                    localStorage.setItem(`answers_${s.id}`, JSON.stringify(data[s.id]));
                }
            });
            hideImportModal();
            renderCards();
            alert('导入成功！');
        } catch (e) {
            alert('导入失败：数据格式错误');
        }
    }

    function clearAll() {
        if (confirm('确定要清除所有答案吗？此操作不可恢复！')) {
            systems.forEach(s => localStorage.removeItem(`answers_${s.id}`));
            renderCards();
        }
    }

    renderCards();
    </script>
</body>
</html>
