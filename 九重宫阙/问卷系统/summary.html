<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>九重宫阙 - 方案确认汇总</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #16213e 0%, #0f3460 100%); padding: 30px 20px; text-align: center; }
        .header h1 { color: #e94560; font-size: 2em; }
        .header p { color: #888; margin-top: 8px; }
        .nav { display: flex; justify-content: space-between; padding: 15px 20px; background: #0f3460; }
        .nav a { color: #e94560; text-decoration: none; padding: 8px 16px; border-radius: 6px; transition: all 0.3s; }
        .nav a:hover { background: #e94560; color: white; }
        .container { max-width: 900px; margin: 0 auto; padding: 30px 20px; }
        .progress { text-align: center; margin: 20px 0; }
        .progress .bar { height: 20px; background: #0f3460; border-radius: 10px; overflow: hidden; margin: 10px 0; }
        .progress .fill { height: 100%; background: linear-gradient(90deg, #e94560, #ff6b6b); width: 0%; transition: width 0.5s; }
        .progress .text { color: #e94560; font-size: 1.1em; font-weight: bold; }
        .system { background: #16213e; border-radius: 12px; padding: 20px; margin: 15px 0; }
        .system h3 { color: #e94560; margin-bottom: 15px; border-bottom: 2px solid #0f3460; padding-bottom: 8px; }
        .answer { padding: 10px 15px; margin: 8px 0; background: #0f3460; border-radius: 8px; border-left: 3px solid #e94560; }
        .answer .q { color: #888; font-size: 0.9em; margin-bottom: 4px; }
        .answer .a { color: #fff; font-weight: bold; }
        .answer .a.custom { color: #f1c40f; }
        .answer .pending { color: #e74c3c; font-style: italic; }
        .btn-group { text-align: center; margin: 30px 0; }
        .btn { display: inline-block; padding: 15px 40px; font-size: 1.1em; border: none; border-radius: 8px; cursor: pointer; margin: 10px 5px; font-weight: bold; transition: all 0.3s; }
        .btn-primary { background: #e94560; color: white; }
        .btn-primary:hover { background: #c73e54; transform: translateY(-2px); }
        .btn-secondary { background: #0f3460; color: white; }
        .btn-secondary:hover { background: #1a1a4e; }
        .btn-success { background: #2ecc71; color: white; }
        .btn-success:hover { background: #27ae60; }
        #result { display: none; margin: 20px 0; }
        #result pre { background: #0f3460; padding: 20px; border-radius: 10px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; font-size: 14px; max-height: 600px; overflow-y: auto; border: 2px solid #e94560; }
        .copy-success { text-align: center; color: #2ecc71; font-size: 1.1em; margin: 10px 0; display: none; }
    </style>
</head>
<body>
    <div class="header">
        <h1>九重宫阙</h1>
        <p>方案确认汇总</p>
    </div>
    <div class="nav">
        <a href="index.html">← 返回目录</a>
        <a href="#" onclick="downloadFile()">下载答案文件</a>
    </div>
    
    <div class="container">
        <div class="progress">
            <div class="text">完成进度：<span id="progressText">0</span> / 63 题</div>
            <div class="bar"><div class="fill" id="progressFill"></div></div>
        </div>

        <div id="summaryContent">
            <!-- Will be generated by JS -->
        </div>

        <div class="btn-group">
            <button class="btn btn-primary" onclick="generateResult()">生成汇总文本</button>
            <button class="btn btn-success" onclick="copyResult()">一键复制答案</button>
            <button class="btn btn-secondary" onclick="clearAll()">清除所有答案</button>
        </div>

        <div class="copy-success" id="copySuccess">✓ 已复制到剪贴板</div>

        <div id="result">
            <h3 style="color: #e94560; margin-bottom: 15px;">汇总文本（可直接复制）：</h3>
            <pre id="answerText"></pre>
        </div>
    </div>

    <script>
    const systems = [
        { id: '01', name: '修炼系统', questions: ['境界划分数量', '突破失败惩罚', '渡劫战斗触发条件', '洞府系统', '修炼速度'] },
        { id: '02', name: '战斗系统', questions: ['战斗方式', '伤害公式', '战斗时间限制', '技能系统', '属性克制'] },
        { id: '03', name: '副本系统', questions: ['副本类型', '副本评价系统', 'BOSS设计', '副本组队', '副本扫荡'] },
        { id: '04', name: '装备系统', questions: ['装备品质', '装备强化', '套装效果', '装备升星', '装备获取'] },
        { id: '05', name: '功法系统', questions: ['功法装备数量', '功法技能数量', '功法品质', '功法获取'] },
        { id: '06', name: '灵宠系统', questions: ['灵宠出战数量', '灵宠培养方式', '灵宠技能', '灵宠获取'] },
        { id: '07', name: '仙盟系统', questions: ['仙盟等级', '仙盟建筑', '仙盟职位', '仙盟战', '仙盟探索'] },
        { id: '08', name: '变现系统', questions: ['VIP等级', '套餐类型', '充值档位', '首充奖励', '氪金原则'] },
        { id: '09', name: '竞技系统', questions: ['竞技场奖励', '擂台赛', '服战联赛', '竞技商店', '赛季重置'] },
        { id: '10', name: '赛季系统', questions: ['赛季周期', '赛季奖励', '赛季任务', '赛季排名'] },
        { id: '11', name: '飞升系统', questions: ['飞升转化', '飞升条件', '飞升奖励', '新玩家补偿'] },
        { id: '12', name: '挂机系统', questions: ['挂机模式', '离线挂机', '体力恢复', '挂机加速', '智能挂机'] },
        { id: '13', name: '签到系统', questions: ['连续签到', '补签机制', 'VIP签到'] },
        { id: '14', name: '成就系统', questions: ['成就分类', '成就奖励', '成就难度', '成就数量'] }
    ];

    function loadSummary() {
        const container = document.getElementById('summaryContent');
        container.innerHTML = '';
        let totalAnswered = 0;
        let totalQuestions = 0;

        systems.forEach(system => {
            const answers = JSON.parse(localStorage.getItem(`answers_${system.id}`) || '{}');
            const div = document.createElement('div');
            div.className = 'system';
            
            let html = `<h3>${system.name}</h3>`;
            system.questions.forEach((q, idx) => {
                totalQuestions++;
                const key = `q${idx + 1}`;
                const answer = answers[key];
                if (answer) {
                    totalAnswered++;
                    const isCustom = answer.startsWith('自定义');
                    html += `<div class="answer">
                        <div class="q">Q${idx + 1}. ${q}</div>
                        <div class="a ${isCustom ? 'custom' : ''}">${answer}</div>
                    </div>`;
                } else {
                    html += `<div class="answer">
                        <div class="q">Q${idx + 1}. ${q}</div>
                        <div class="a pending">未选择</div>
                    </div>`;
                }
            });
            
            div.innerHTML = html;
            container.appendChild(div);
        });

        document.getElementById('progressText').textContent = totalAnswered;
        document.getElementById('progressFill').style.width = `${(totalAnswered / totalQuestions) * 100}%`;
    }

    function generateResult() {
        let result = '=== 九重宫阙方案确认结果 ===\n';
        result += `生成时间：${new Date().toLocaleString()}\n\n`;

        systems.forEach(system => {
            const answers = JSON.parse(localStorage.getItem(`answers_${system.id}`) || '{}');
            result += `【${system.name}】\n`;
            system.questions.forEach((q, idx) => {
                const key = `q${idx + 1}`;
                const answer = answers[key] || '未选择';
                result += `  Q${idx + 1}. ${q}：${answer}\n`;
            });
            result += '\n';
        });

        document.getElementById('answerText').textContent = result;
        document.getElementById('result').style.display = 'block';
        document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
    }

    function copyResult() {
        const text = document.getElementById('answerText').textContent;
        if (!text) {
            generateResult();
        }
        const finalText = document.getElementById('answerText').textContent;
        
        navigator.clipboard.writeText(finalText).then(() => {
            showCopySuccess();
        }).catch(() => {
            const textarea = document.createElement('textarea');
            textarea.value = finalText;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showCopySuccess();
        });
    }

    function showCopySuccess() {
        const el = document.getElementById('copySuccess');
        el.style.display = 'block';
        setTimeout(() => el.style.display = 'none', 2000);
    }

    function downloadFile() {
        generateResult();
        const text = document.getElementById('answerText').textContent;
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `九重宫阙_方案确认_${new Date().toISOString().slice(0,10)}.txt`;
        a.click();
        URL.revokeObjectURL(url);
    }

    function clearAll() {
        if (confirm('确定要清除所有答案吗？此操作不可恢复！')) {
            systems.forEach(s => localStorage.removeItem(`answers_${s.id}`));
            loadSummary();
        }
    }

    loadSummary();
    </script>
</body>
</html>
