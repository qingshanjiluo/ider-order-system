<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>九重宫阙 - 中国古风水墨风</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Ma+Shan+Zheng&display=swap');

  :root {
    --navy: #1a1a2e;
    --royal: #0f3460;
    --crimson: #e94560;
    --gold: #d4af37;
    --gold-light: #f0d78c;
    --ink: #0a0a14;
    --paper: #f5f0e8;
    --text: #e8e0d0;
    --text-dim: #8a8070;
    --border-glow: rgba(212, 175, 55, 0.3);
  }

  body {
    font-family: 'Noto Serif SC', 'SimSun', serif;
    background: var(--ink);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(15, 52, 96, 0.4) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(233, 69, 96, 0.15) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 80%, rgba(212, 175, 55, 0.1) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  /* Ink texture overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  .game-container {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-areas:
      "header header header"
      "sidebar main actions"
      "footer footer footer";
    grid-template-columns: 220px 1fr 200px;
    grid-template-rows: auto 1fr auto;
    min-height: 100vh;
    gap: 2px;
  }

  /* ===== HEADER ===== */
  .header {
    grid-area: header;
    background: linear-gradient(135deg, var(--navy) 0%, var(--royal) 50%, var(--navy) 100%);
    border-bottom: 2px solid var(--gold);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }

  .header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .game-title {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 32px;
    color: var(--gold);
    text-shadow: 0 0 20px rgba(212, 175, 55, 0.5), 0 2px 4px rgba(0,0,0,0.5);
    letter-spacing: 6px;
    position: relative;
  }

  .game-title::after {
    content: '九重宫阙';
    position: absolute;
    top: 2px; left: 2px;
    color: rgba(212, 175, 55, 0.1);
    z-index: -1;
  }

  .player-info {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .player-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 2px solid var(--gold);
    background: linear-gradient(135deg, var(--royal), var(--crimson));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    box-shadow: 0 0 12px var(--border-glow);
  }

  .player-details {
    text-align: right;
  }

  .player-name {
    font-size: 16px;
    color: var(--gold-light);
    font-weight: 700;
  }

  .player-realm {
    font-size: 12px;
    color: var(--crimson);
    text-shadow: 0 0 8px rgba(233, 69, 96, 0.5);
  }

  /* ===== LEFT SIDEBAR ===== */
  .sidebar {
    grid-area: sidebar;
    background: linear-gradient(180deg, rgba(26,26,46,0.95) 0%, rgba(10,10,20,0.98) 100%);
    border-right: 1px solid rgba(212, 175, 55, 0.2);
    padding: 16px 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .sidebar-title {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 14px;
    color: var(--gold);
    padding: 8px 20px;
    letter-spacing: 4px;
    border-bottom: 1px solid rgba(212, 175, 55, 0.15);
    margin-bottom: 8px;
  }

  .nav-item {
    padding: 12px 20px;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 14px;
    color: var(--text-dim);
    position: relative;
    border-left: 3px solid transparent;
  }

  .nav-item:hover {
    background: linear-gradient(90deg, rgba(212, 175, 55, 0.1) 0%, transparent 100%);
    color: var(--gold-light);
    border-left-color: var(--gold);
  }

  .nav-item.active {
    background: linear-gradient(90deg, rgba(233, 69, 96, 0.15) 0%, transparent 100%);
    color: var(--crimson);
    border-left-color: var(--crimson);
  }

  .nav-icon {
    width: 20px;
    text-align: center;
    font-size: 16px;
  }

  /* ===== MAIN CONTENT ===== */
  .main-content {
    grid-area: main;
    padding: 24px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .card {
    background: linear-gradient(145deg, rgba(26,26,46,0.9), rgba(15,52,96,0.6));
    border: 1px solid rgba(212, 175, 55, 0.25);
    border-radius: 8px;
    padding: 20px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3), inset 0 1px 0 rgba(212, 175, 55, 0.1);
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .card-title {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 20px;
    color: var(--gold);
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(212, 175, 55, 0.15);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card-title::before {
    content: '◆';
    color: var(--crimson);
    font-size: 12px;
  }

  /* Character Status */
  .char-header {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 20px;
  }

  .char-avatar {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: 3px solid var(--gold);
    background: linear-gradient(135deg, var(--royal), var(--crimson));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    box-shadow: 0 0 20px var(--border-glow);
    flex-shrink: 0;
  }

  .char-info { flex: 1; }

  .char-name {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 28px;
    color: var(--gold-light);
    margin-bottom: 4px;
  }

  .char-realm {
    font-size: 14px;
    color: var(--crimson);
    margin-bottom: 8px;
  }

  .char-level {
    display: inline-block;
    background: linear-gradient(135deg, var(--crimson), #c0392b);
    color: white;
    padding: 2px 12px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 700;
  }

  .bar-group { margin-bottom: 12px; }

  .bar-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    margin-bottom: 4px;
    color: var(--text-dim);
  }

  .bar-track {
    height: 16px;
    background: rgba(0,0,0,0.4);
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid rgba(212, 175, 55, 0.15);
  }

  .bar-fill {
    height: 100%;
    border-radius: 8px;
    transition: width 0.5s ease;
    position: relative;
    overflow: hidden;
  }

  .bar-fill::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, transparent 60%);
  }

  .bar-hp { background: linear-gradient(90deg, #c0392b, var(--crimson)); }
  .bar-mp { background: linear-gradient(90deg, #1a5276, #3498db); }

  /* Stats */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  .stat-item {
    text-align: center;
    padding: 12px 8px;
    background: rgba(0,0,0,0.2);
    border-radius: 8px;
    border: 1px solid rgba(212, 175, 55, 0.12);
    transition: all 0.3s ease;
  }

  .stat-item:hover {
    border-color: var(--gold);
    box-shadow: 0 0 12px var(--border-glow);
    transform: translateY(-2px);
  }

  .stat-icon { font-size: 20px; margin-bottom: 4px; }
  .stat-value { font-size: 18px; font-weight: 700; color: var(--gold-light); }
  .stat-name { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

  /* Equipment */
  .equip-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  .equip-slot {
    aspect-ratio: 1;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(212, 175, 55, 0.2);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
  }

  .equip-slot:hover {
    border-color: var(--gold);
    box-shadow: 0 0 16px var(--border-glow);
    transform: scale(1.05);
  }

  .equip-slot.equipped { border-color: var(--crimson); }

  .equip-slot.equipped::after {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: 8px;
    border: 1px solid var(--crimson);
    opacity: 0.5;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.8; }
  }

  .equip-icon { font-size: 24px; }
  .equip-name { font-size: 10px; color: var(--text-dim); }
  .equip-empty { font-size: 10px; color: rgba(255,255,255,0.15); }

  /* ===== RIGHT SIDEBAR ===== */
  .actions {
    grid-area: actions;
    background: linear-gradient(180deg, rgba(26,26,46,0.95) 0%, rgba(10,10,20,0.98) 100%);
    border-left: 1px solid rgba(212, 175, 55, 0.2);
    padding: 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .action-btn {
    padding: 14px 12px;
    background: linear-gradient(145deg, rgba(15, 52, 96, 0.6), rgba(26, 26, 46, 0.8));
    border: 1px solid rgba(212, 175, 55, 0.2);
    border-radius: 8px;
    color: var(--text);
    cursor: pointer;
    text-align: center;
    transition: all 0.3s ease;
    font-family: 'Noto Serif SC', serif;
    font-size: 14px;
    position: relative;
    overflow: hidden;
  }

  .action-btn::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 0; height: 0;
    background: rgba(212, 175, 55, 0.1);
    border-radius: 50%;
    transition: all 0.5s ease;
    transform: translate(-50%, -50%);
  }

  .action-btn:hover::before {
    width: 200%;
    height: 200%;
  }

  .action-btn:hover {
    border-color: var(--gold);
    box-shadow: 0 0 20px var(--border-glow);
    transform: translateY(-2px);
    color: var(--gold-light);
  }

  .action-btn .icon { font-size: 20px; margin-bottom: 4px; display: block; }

  /* ===== FOOTER ===== */
  .footer {
    grid-area: footer;
    background: linear-gradient(0deg, rgba(10,10,20,0.98) 0%, rgba(26,26,46,0.95) 100%);
    border-top: 1px solid rgba(212, 175, 55, 0.2);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .chat-input {
    flex: 1;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(212, 175, 55, 0.2);
    border-radius: 20px;
    padding: 8px 16px;
    color: var(--text);
    font-family: 'Noto Serif SC', serif;
    font-size: 13px;
    outline: none;
    transition: border-color 0.3s;
  }

  .chat-input:focus {
    border-color: var(--gold);
  }

  .chat-input::placeholder { color: var(--text-dim); }

  .notification-badge {
    position: relative;
    cursor: pointer;
    font-size: 18px;
    padding: 6px;
  }

  .notification-badge::after {
    content: '3';
    position: absolute;
    top: 0; right: 0;
    background: var(--crimson);
    color: white;
    font-size: 10px;
    width: 16px; height: 16px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
  }

  .server-time {
    font-size: 12px;
    color: var(--text-dim);
    white-space: nowrap;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(212, 175, 55, 0.3); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(212, 175, 55, 0.5); }
</style>
</head>
<body>
<div class="game-container">

  <!-- HEADER -->
  <header class="header">
    <div class="game-title">九重宫阙</div>
    <div class="player-info">
      <div class="player-details">
        <div class="player-name">逍遥散人</div>
        <div class="player-realm">元婴中期 · Lv.35</div>
      </div>
      <div class="player-avatar">仙</div>
    </div>
  </header>

  <!-- LEFT SIDEBAR -->
  <nav class="sidebar">
    <div class="sidebar-title">功能导航</div>
    <div class="nav-item active"><span class="nav-icon">⚔</span>角色</div>
    <div class="nav-item"><span class="nav-icon">🎒</span>背包</div>
    <div class="nav-item"><span class="nav-icon">📜</span>任务</div>
    <div class="nav-item"><span class="nav-icon">🏰</span>仙盟</div>
    <div class="nav-item"><span class="nav-icon">🗺</span>地图</div>
    <div class="nav-item"><span class="nav-icon">🐉</span>灵宠</div>
    <div class="nav-item"><span class="nav-icon">📖</span>功法</div>
    <div class="nav-item"><span class="nav-icon">⚗</span>炼丹</div>
    <div class="nav-item"><span class="nav-icon">🔔</span>邮件</div>
    <div class="nav-item"><span class="nav-icon">⚙</span>设置</div>
  </nav>

  <!-- MAIN CONTENT -->
  <main class="main-content">

    <!-- Character Status Card -->
    <div class="card">
      <div class="card-title">角色信息</div>
      <div class="char-header">
        <div class="char-avatar">仙</div>
        <div class="char-info">
          <div class="char-name">逍遥散人</div>
          <div class="char-realm">元婴中期</div>
          <span class="char-level">Lv.35</span>
        </div>
      </div>
      <div class="bar-group">
        <div class="bar-label"><span>气血</span><span>8,520 / 12,000</span></div>
        <div class="bar-track"><div class="bar-fill bar-hp" style="width:71%"></div></div>
      </div>
      <div class="bar-group">
        <div class="bar-label"><span>灵力</span><span>5,340 / 8,000</span></div>
        <div class="bar-track"><div class="bar-fill bar-mp" style="width:67%"></div></div>
      </div>
    </div>

    <!-- Stats Card -->
    <div class="card">
      <div class="card-title">属性面板</div>
      <div class="stats-grid">
        <div class="stat-item">
          <div class="stat-icon">⚔</div>
          <div class="stat-value">2,458</div>
          <div class="stat-name">攻击</div>
        </div>
        <div class="stat-item">
          <div class="stat-icon">🛡</div>
          <div class="stat-value">1,872</div>
          <div class="stat-name">防御</div>
        </div>
        <div class="stat-item">
          <div class="stat-icon">❤</div>
          <div class="stat-value">12,000</div>
          <div class="stat-name">生命</div>
        </div>
        <div class="stat-item">
          <div class="stat-icon">💨</div>
          <div class="stat-value">1,235</div>
          <div class="stat-name">速度</div>
        </div>
      </div>
    </div>

    <!-- Equipment Card -->
    <div class="card">
      <div class="card-title">装备栏</div>
      <div class="equip-grid">
        <div class="equip-slot equipped"><div class="equip-icon">🗡</div><div class="equip-name">青莲剑</div></div>
        <div class="equip-slot equipped"><div class="equip-icon">🛡</div><div class="equip-name">玄武甲</div></div>
        <div class="equip-slot equipped"><div class="equip-icon">💍</div><div class="equip-name">乾坤戒</div></div>
        <div class="equip-slot equipped"><div class="equip-icon">📿</div><div class="equip-name">舍利串</div></div>
        <div class="equip-slot equipped"><div class="equip-icon">👢</div><div class="equip-name">踏云靴</div></div>
        <div class="equip-slot equipped"><div class="equip-icon">👑</div><div class="equip-name">紫金冠</div></div>
        <div class="equip-slot"><div class="equip-icon">🪶</div><div class="equip-empty">翅膀</div></div>
        <div class="equip-slot"><div class="equip-icon">🔮</div><div class="equip-empty">法宝</div></div>
      </div>
    </div>

  </main>

  <!-- RIGHT SIDEBAR -->
  <aside class="actions">
    <div class="action-btn"><span class="icon">🧘</span>修炼</div>
    <div class="action-btn"><span class="icon">🏯</span>副本</div>
    <div class="action-btn"><span class="icon">🏰</span>仙盟</div>
    <div class="action-btn"><span class="icon">🛒</span>商店</div>
    <div class="action-btn"><span class="icon">🎲</span>抽奖</div>
    <div class="action-btn"><span class="icon">🏆</span>排行</div>
  </aside>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="notification-badge">🔔</div>
    <input class="chat-input" type="text" placeholder="世界频道：输入聊天内容...">
    <div class="server-time">服务器时间：2026-08-31 19:42</div>
  </footer>

</div>
</body>
</html>
