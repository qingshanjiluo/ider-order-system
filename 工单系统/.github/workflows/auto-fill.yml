# 自动补齐工单 — 每 2 小时执行一次，补充未满的账号
# 与 Order Scan 错开 30 分钟，避免同时执行
name: 自动补齐工单

on:
  schedule:
    - cron: '30 */2 * * *'
  workflow_dispatch:

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 补齐工单账号
        run: node scan_orders.js
        working-directory: gh-actions
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          API_BASE: ${{ secrets.API_BASE }}
          CLIENT_VERSION: ${{ secrets.CLIENT_VERSION }}
          SIGN_KEY: ${{ secrets.SIGN_KEY }}
