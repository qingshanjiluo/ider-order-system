# 快速自动升级 — 每 2 小时执行一次（与原有的 3 小时工作流互补）
name: Auto Levelup (Fast)

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  levelup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run level up
        run: node level_up.js
        working-directory: gh-actions
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          API_BASE: ${{ secrets.API_BASE }}
          CLIENT_VERSION: ${{ secrets.CLIENT_VERSION }}
          SIGN_KEY: ${{ secrets.SIGN_KEY }}
