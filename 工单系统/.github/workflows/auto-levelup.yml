# 一键升级工作流 — 每 3 小时执行一次，防封号
name: Auto Levelup

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  levelup:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run level up
        run: node level_up.js
        working-directory: gh-actions
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          API_BASE: ${{ secrets.API_BASE }}
          CLIENT_VERSION: ${{ secrets.CLIENT_VERSION }}
          SIGN_KEY: ${{ secrets.SIGN_KEY }}
