# 订单扫描工作流 — 每 2 小时执行一次，防封号
name: Order Scan

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run order scanner
        run: node scan_orders.js
        working-directory: gh-actions
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          API_BASE: ${{ secrets.API_BASE }}
          CLIENT_VERSION: ${{ secrets.CLIENT_VERSION }}
          SIGN_KEY: ${{ secrets.SIGN_KEY }}
